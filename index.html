<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسببات الحساسية | الصفدي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cairo:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1d211c;
    --bg-2: #262b23;
    --card: #2c3227;
    --gold: #d9a441;
    --gold-soft: #b98a3c;
    --cream: #f2ecdd;
    --cream-dim: #cfc8b3;
    --line: #3c4335;
    --danger: #c8543d;
    --trace: #7f8a6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, #2a3324 0%, transparent 45%),
      radial-gradient(circle at 100% 30%, #24291f 0%, transparent 50%),
      var(--bg);
    color:var(--cream);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:34px 20px 22px;
    text-align:center;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    color:var(--gold);
    letter-spacing:.3em;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-size:28px;
    font-weight:800;
    margin:0 0 6px;
    color:var(--cream);
  }
  header p{
    color:var(--cream-dim);
    font-size:14px;
    margin:0;
    font-weight:400;
  }
  .stamp{
    position:absolute;
    top:18px;
    left:20px;
    width:44px;
    height:44px;
    border:1.5px solid var(--gold-soft);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:var(--gold);
    opacity:.85;
    transform:rotate(-8deg);
  }

  .search-wrap{
    max-width:640px;
    margin:24px auto 0;
    padding:0 20px;
  }
  .search-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;
    align-items:center;
    padding:6px 16px;
    box-shadow: 0 10px 30px -12px rgba(0,0,0,.5);
    position:relative;
  }
  .search-box svg{flex-shrink:0; color:var(--gold);}
  #searchInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--cream);
    font-family:inherit;
    font-size:17px;
    padding:14px 10px;
  }
  #searchInput::placeholder{color:var(--cream-dim); opacity:.6;}
  .hint{
    text-align:center;
    color:var(--cream-dim);
    font-size:12px;
    margin-top:10px;
    opacity:.75;
  }

  .results{
    max-width:640px;
    margin:22px auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .item-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 16px;
    animation: rise .28s ease both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    border-bottom:1px dashed var(--line);
    padding-bottom:10px;
    margin-bottom:12px;
  }
  .item-name-en{
    font-weight:700;
    font-size:17px;
    color:var(--cream);
  }
  .item-cat{
    font-size:11px;
    color:var(--gold);
    letter-spacing:.05em;
    white-space:nowrap;
  }
  .item-name-ar{
    font-size:13px;
    color:var(--cream-dim);
    margin-top:2px;
  }

  .row-label{
    font-size:11px;
    color:var(--cream-dim);
    margin-bottom:7px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:14px;
  }
  .tags:last-child{margin-bottom:0;}
  .tag{
    font-size:12.5px;
    font-weight:600;
    padding:5px 11px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .tag.danger{
    background:rgba(200,84,61,.18);
    color:#e18468;
    border:1px solid rgba(200,84,61,.4);
  }
  .tag.trace{
    background:rgba(127,138,106,.15);
    color:#b7c19c;
    border:1px solid rgba(127,138,106,.35);
  }
  .none-note{
    font-size:13px;
    color:var(--cream-dim);
    opacity:.7;
  }

  .empty-state{
    text-align:center;
    color:var(--cream-dim);
    padding:50px 20px;
    opacity:.75;
    font-size:14px;
    line-height:1.9;
  }
  .empty-state b{color:var(--gold); display:block; font-size:16px; margin-bottom:6px;}

  .browse{
    max-width:640px;
    margin:8px auto 0;
    padding:0 20px;
  }
  .cat-chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .cat-chip{
    font-size:12.5px;
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--cream-dim);
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:.15s;
  }
  .cat-chip:hover, .cat-chip.active{
    border-color:var(--gold-soft);
    color:var(--gold);
  }
  .cat-chip .en{opacity:.65; font-size:11px;}

  .legend{
    max-width:640px;
    margin:34px auto 0;
    padding:16px 20px;
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--cream-dim);
  }
  .legend span{display:flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.d{background:#c8543d;}
  .dot.t{background:#7f8a6a;}

  footer{
    text-align:center;
    color:var(--cream-dim);
    font-size:11px;
    opacity:.5;
    margin-top:30px;
  }
</style>
</head>
<body>

<header>
  <div class="stamp">✺</div>
  <div class="eyebrow">دليل المطعم</div>
  <h1>مسببات الحساسية</h1>
  <p>اكتب اسم الطبق وشوف مكوناته المسببة للحساسية بالتفصيل</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="مثال: حمص، Hummus، شاورما..." autocomplete="off">
  </div>
  <div class="hint">دور بالعربي أو بالإنجليزي — بيطلعلك كل الأطباق المطابقة</div>
</div>

<div class="browse" id="browseWrap">
  <div class="cat-chip-row" id="catChips"></div>
</div>

<div class="results" id="results"></div>

<div class="legend">
  <span><i class="dot d"></i> مسبب حساسية مؤكد بالطبق</span>
  <span><i class="dot t"></i> احتمال وجود آثار (تلوث متبادل)</span>
</div>

<footer>البيانات مبنية على جدول إفصاح المسببات الرسمي للمطعم</footer>

const ALLERGEN_AR = {
  "Milk":"حليب","Sesame":"سمسم","Gluten":"غلوتين","Egg":"بيض","Tree Nut":"مكسرات",
  "Soy":"صويا","Peanut":"فول سوداني","Mustard":"خردل","Lupine":"لوبين","Sulphite":"كبريتيت",
  "Celery":"كرفس","Fish":"سمك","Crustaceans":"قشريات","Mollusks":"رخويات","Wheat":"قمح"
};

// flatten
const ITEMS = [];
DATA.forEach(([catEn, catAr, items]) => {
  items.forEach(([nameEn, nameAr, allergens, traces]) => {
    ITEMS.push({catEn, catAr, nameEn, nameAr, allergens, traces});
  });
});

const resultsEl = document.getElementById('results');
const input = document.getElementById('searchInput');
const catChips = document.getElementById('catChips');
const browseWrap = document.getElementById('browseWrap');

function norm(s){
  return s.toLowerCase()
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim();
}

function tagHtml(name, cls){
  const ar = ALLERGEN_AR[name] || name;
  return `<span class="tag ${cls}">${ar} <span style="opacity:.6">· ${name}</span></span>`;
}

function cardHtml(it){
  const allergensHtml = it.allergens.length
    ? `<div class="row-label">مسبب حساسية بالطبق</div><div class="tags">${it.allergens.map(a=>tagHtml(a,'danger')).join('')}</div>`
    : `<div class="none-note">لا توجد مسببات حساسية معلنة مباشرة في هذا الطبق.</div>`;
  const tracesHtml = it.traces.length
    ? `<div class="row-label">احتمال وجود آثار منه (تلوث متبادل)</div><div class="tags">${it.traces.map(a=>tagHtml(a,'trace')).join('')}</div>`
    : '';
  return `
  <div class="item-card">
    <div class="item-top">
      <div>
        <div class="item-name-en">${it.nameEn}</div>
        <div class="item-name-ar">${it.nameAr}</div>
      </div>
      <div class="item-cat">${it.catAr}</div>
    </div>
    ${allergensHtml}
    ${tracesHtml}
  </div>`;
}

function render(list){
  if(!list.length){
    resultsEl.innerHTML = `<div class="empty-state"><b>ما لقيت طبق بهالاسم</b>جرّب تكتب جزء من الاسم بالعربي أو الإنجليزي، مثلاً «حمص» أو «Kafta»</div>`;
    return;
  }
  resultsEl.innerHTML = list.map(cardHtml).join('');
}

function search(q){
  if(!q){
    resultsEl.innerHTML = '';
    return;
  }
  const nq = norm(q);
  const matched = ITEMS.filter(it =>
    norm(it.nameEn).includes(nq) || norm(it.nameAr).includes(nq)
  );
  render(matched);
}

let activeCat = null;
function buildChips(){
  const cats = [...new Set(DATA.map(d => d[0]))];
  catChips.innerHTML = DATA.map(([en,ar]) =>
    `<button class="cat-chip" data-cat="${en}">${ar} <span class="en">· ${en}</span></button>`
  ).join('');
  catChips.querySelectorAll('.cat-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.cat;
      if(activeCat === cat){
        activeCat = null;
        btn.classList.remove('active');
        resultsEl.innerHTML = '';
        input.value = '';
        return;
      }
      catChips.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = cat;
      input.value = '';
      render(ITEMS.filter(it => it.catEn === cat));
    });
  });
}

input.addEventListener('input', (e)=>{
  activeCat = null;
  catChips.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
  search(e.target.value);
});

buildChips();
</script>
